[project]
name = "natro-server"
version = "0.1.0"
description = "Natro's server: the brain (the agent loop, identity, tools, confirmations and costs) and the voice pipeline (Georgian speech, with English mixed in, to English: Google Chirp 3 + Claude). Runs on the VPS."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "mcp>=2.3",
    "websockets>=15",
    # Calendar, Tasks and Gmail over Google's REST APIs.
    "google-auth>=2.40",
    "requests",
    # Time zones on Windows, which has no system zone database.
    "tzdata",
    # Reading PDFs from Google Drive, and working on his PDFs (pdf.py; crypto: locking and unlocking them).
    # Compressing, JPGs and OCR use Ghostscript and OCRmyPDF, installed on the VPS with apt.
    "pypdf[crypto]",
    # Watermarks and page numbers (pdf.py).
    "reportlab",
    # Repeating reminders (RRULEs).
    "python-dateutil",
    # Converting pictures (convert.py), HEIC from a phone too. Documents, audio and video use
    # LibreOffice, pandoc and ffmpeg, installed on the VPS with apt.
    "pillow",
    "pillow-heif",
    # The voice pipeline (natro_voice): recognition, and decoding the devices' recordings.
    "google-cloud-speech>=2.41",
    "av",
]

[project.optional-dependencies]
dev = ["pytest"]
# The one-time Google sign-in (natro_agent.google_signin), on the PC.
signin = ["google-auth-oauthlib"]
# voice-tools/record_tests.py records with the microphone.
voice-tools = ["sounddevice"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["natro_agent", "natro_voice"]

[tool.setuptools.package-data]
# The dashboard's page (dashboard.py), and the names and terms Google is told to expect (natro_voice/config.py).
natro_agent = ["web/*", "web/fonts/*"]
natro_voice = ["wordlist.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
