[package]
name = "natro"
version = "0.1.0"
description = "Natro on the PC: the dock, the tray, the talk key."
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "natro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
# One Natro: a second start (Explorer's "Send to") hands its files to the running one.
tauri-plugin-single-instance = "2"
# The tray's "Send files to the phone…" picker.
tauri-plugin-dialog = "2"
# The microphone.
cpal = "0.18.2"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
tokio = { version = "1.53.2", features = ["sync", "time", "macros"] }
# App icons for the dock's steps.
png = "0.17"
base64 = "0.23"
# The Settings window's PIN: kept as a salted hash, as on the server (agent/natro_agent/keys.py).
scrypt = { version = "0.11", default-features = false }
getrandom = "0.3"

# The same version Tauri and cpal use, so it's compiled once.
# Checking the PIN takes 50 ms optimized; unoptimized, seconds.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
