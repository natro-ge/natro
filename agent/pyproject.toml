[project]
name = "natro-agent"
version = "0.1.0"
description = "Natro's brain: the agent loop, identity, tools, confirmations and costs. Runs on the VPS."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "mcp>=2.3",
    "websockets>=15",
    # Calendar, Tasks and Gmail over Google's REST APIs.
    "google-auth>=2.40",
    "requests",
    # Time zones on Windows, which has no system zone database.
    "tzdata",
    # Reading PDFs from Google Drive, and working on his PDFs (pdf.py; crypto: locking and unlocking them).
    # Compressing, JPGs and OCR use Ghostscript and OCRmyPDF, installed on the VPS with apt.
    "pypdf[crypto]",
    # Watermarks and page numbers (pdf.py).
    "reportlab",
    # Repeating reminders (RRULEs).
    "python-dateutil",
    # Converting pictures (convert.py), HEIC from a phone too. Documents, audio and video use
    # LibreOffice, pandoc and ffmpeg, installed on the VPS with apt.
    "pillow",
    "pillow-heif",
]

[project.optional-dependencies]
dev = ["pytest"]
# The one-time Google sign-in (natro_agent.google_signin), on the PC.
signin = ["google-auth-oauthlib"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["natro_agent"]

[tool.setuptools.package-data]
# The dashboard's page (dashboard.py).
natro_agent = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
